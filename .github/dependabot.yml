version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directories:
      - /services/catalog-service
      - /services/fulfillment-service
      - /services/gateway
      - /services/inventory-service
      - /services/order-service
      - /services/payment-service
      - /services/promotion-service
      - /services/read-model-service
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # 프레임워크 메이저 업그레이드는 코드 마이그레이션을 동반하므로 사람이 판단한다.
    # 마이너·패치 보안 갱신은 계속 받는다.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - /apps/admin-app
      - /apps/customer-app
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # 프레임워크 메이저 업그레이드는 코드 마이그레이션을 동반하므로 사람이 판단한다.
    # 마이너·패치 보안 갱신은 계속 받는다.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      npm-production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  # mobile-app은 Expo SDK가 react·react-native 버전을 정한다(SDK 54: react 19.1.0,
  # react-native 0.81.5). 이 둘을 SDK와 따로 올리면 jest-expo preset과 npm ci가 깨지므로
  # SDK를 올릴 때 사람이 함께 옮긴다. 나머지 마이너·패치 갱신은 계속 받는다.
  - package-ecosystem: npm
    directory: /apps/mobile-app
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: react
        update-types:
          - version-update:semver-minor
      - dependency-name: react-native
        update-types:
          - version-update:semver-minor
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-minor
      # 이 렌더러를 올리면 peer가 더 높은 react를 요구해 npm ci가 ERESOLVE로 실패한다.
      - dependency-name: react-test-renderer
    groups:
      mobile-npm-production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      mobile-npm-development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /apps
      - /services
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # 기준 JDK는 services/*/pom.xml의 java.version, 기준 Node는 ci.yml의 node-version이 정한다.
    # 태그 접미사 -eclipse-temurin-NN의 JDK 메이저는 dependabot의 semver 비교 대상이 아니어서
    # minor/patch 그룹으로도 걸러지지 않으므로 두 이미지는 전체를 무시하고 사람이 함께 올린다.
    ignore:
      - dependency-name: maven
      - dependency-name: eclipse-temurin
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
