# main 기준 컨테이너 이미지를 빌드하고 배포 레지스트리에 게시하는 릴리스 흐름입니다.
name: Release Images

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref or SHA to publish
        required: false
        default: main
      image_tag:
        description: Additional image tag
        required: false
        default: latest-demo

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_ref || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: catalog-service
            dockerfile: services/Dockerfile
            build_args: |
              SERVICE_DIR=services/catalog-service
              SERVICE_PORT=18081
          - image: inventory-service
            dockerfile: services/Dockerfile
            build_args: |
              SERVICE_DIR=services/inventory-service
              SERVICE_PORT=18082
          - image: order-service
            dockerfile: services/Dockerfile
            build_args: |
              SERVICE_DIR=services/order-service
              SERVICE_PORT=18083
          - image: payment-service
            dockerfile: services/Dockerfile
            build_args: |
              SERVICE_DIR=services/payment-service
              SERVICE_PORT=18084
          - image: promotion-service
            dockerfile: services/Dockerfile
            build_args: |
              SERVICE_DIR=services/promotion-service
              SERVICE_PORT=18085
          - image: fulfillment-service
            dockerfile: services/Dockerfile
            build_args: |
              SERVICE_DIR=services/fulfillment-service
              SERVICE_PORT=18086
          - image: read-model-service
            dockerfile: services/Dockerfile
            build_args: |
              SERVICE_DIR=services/read-model-service
              SERVICE_PORT=18087
          - image: gateway
            dockerfile: services/Dockerfile
            build_args: |
              SERVICE_DIR=services/gateway
              SERVICE_PORT=18080
          - image: customer-app
            dockerfile: apps/Dockerfile
            build_args: |
              APP_DIR=customer-app
          - image: admin-app
            dockerfile: apps/Dockerfile
            build_args: |
              APP_DIR=admin-app
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source and image tag
        id: vars
        env:
          RELEASE_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'latest-demo' }}
        run: |
          set -euo pipefail
          full_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$full_sha" origin/main || {
            echo "Release source must be part of origin/main history" >&2
            exit 1
          }
          short_sha="$(git rev-parse --short=12 HEAD)"
          image_tag="$RELEASE_IMAGE_TAG"
          [[ "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]] || {
            echo "Invalid OCI image tag: ${image_tag}" >&2
            exit 1
          }
          echo "full_sha=${full_sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "image_name=ghcr.io/${{ github.repository_owner }}/stockrush-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "scan_image=stockrush-scan-${{ matrix.image }}:${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 scan candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.vars.outputs.scan_image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan candidate before publishing
        env:
          TRIVY_NO_PROGRESS: "true"
        run: |
          timeout 10m docker run --rm \
            -e TRIVY_NO_PROGRESS \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${{ steps.vars.outputs.scan_image }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}
            ${{ steps.vars.outputs.image_name }}:git-${{ steps.vars.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.full_sha }}
            org.opencontainers.image.title=StockRush ${{ matrix.image }}

      - name: Scan published image for vulnerabilities
        env:
          TRIVY_NO_PROGRESS: "true"
        run: |
          docker run --rm \
            -e TRIVY_NO_PROGRESS \
            -v "$HOME/.docker:/root/.docker:ro" \
            aquasec/trivy:0.69.3 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${{ steps.vars.outputs.image_name }}@${{ steps.publish.outputs.digest }}"

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo "- `${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}`"
            echo "- `${{ steps.vars.outputs.image_name }}:git-${{ steps.vars.outputs.short_sha }}`"
            echo "- Digest: `${{ steps.publish.outputs.digest }}`"
            echo "- Source commit: `${{ steps.vars.outputs.full_sha }}`"
          } >> "$GITHUB_STEP_SUMMARY"
