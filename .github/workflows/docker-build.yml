# Dockerfile / 이미지 패키징 컨텍스트 변경 PR에서만 대표 이미지를 빌드 검증합니다 (push 없음).
name: Docker Build

on:
  pull_request:
    paths:
      - "services/Dockerfile"
      - "apps/Dockerfile"
      - ".dockerignore"
      - "apps/nginx/**"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-services:
    name: Docker services image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build gateway image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/Dockerfile
          push: false
          build-args: |
            SERVICE_DIR=services/gateway
            SERVICE_PORT=18080
          cache-from: type=gha,scope=pr-gateway
          cache-to: type=gha,mode=max,scope=pr-gateway

  docker-apps:
    name: Docker apps image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build customer-app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/Dockerfile
          push: false
          build-args: |
            APP_DIR=customer-app
          cache-from: type=gha,scope=pr-customer-app
          cache-to: type=gha,mode=max,scope=pr-customer-app
